services:
  # Apache Pulsar
  pulsar:
    image: apachepulsar/pulsar:3.1.0
    container_name: pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650" # Pulsar broker port
      - "8080:8080" # Pulsar admin port
    environment:
      - PULSAR_MEM=-Xms1g -Xmx1g -XX:MaxDirectMemorySize=512m
      - PULSAR_STANDALONE_USE_ZOOKEEPER=1
    volumes:
      - pulsar_data:/pulsar/data
    networks:
      - internal_net
    healthcheck:
      test: [ "CMD", "bin/pulsar-admin", "brokers", "healthcheck" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  gateway:
    build: gateway
    ports:
      - "6001:6001"
    environment:
      - ENV=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=6001
      - LOG_LEVEL=INFO
      - JWT_SECRET=your-secret-key-here
      - ALGORITHM=HS256
      - PRODUCTOS_SERVICE_URL=http://productos:6002
      - PROVEDORES_SERVICE_URL=http://provedores:6003
      - PULSAR_SERVICE_URL=pulsar://pulsar:6650
    networks:
      - app_net
      - internal_net
    depends_on:
      - pulsar
      - pulsar-init

  productos:
    build: productos
    ports:
      - "6002:6002"
    environment:
      - ENV=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=6002
      - LOG_LEVEL=INFO
      - PULSAR_SERVICE_URL=pulsar://pulsar:6650
    networks:
      - app_net
      - internal_net
    depends_on:
      - pulsar
      - pulsar-init

  provedores:
    build: provedores
    ports:
      - "6003:6003"
    environment:
      - ENV=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=6003
      - LOG_LEVEL=INFO
      - PULSAR_SERVICE_URL=pulsar://pulsar:6650
    networks:
      - app_net
      - internal_net
    depends_on:
      - pulsar
      - pulsar-init

  # Inicialización automática de tópicos Pulsar
  pulsar-init:
    image: apachepulsar/pulsar:3.1.0
    container_name: pulsar-init
    networks:
      - internal_net
    depends_on:
      pulsar:
        condition: service_healthy
    environment:
      - PULSAR_ADMIN_URL=http://pulsar:8080
    command: >
      sh -c "
        echo '🔧 Inicializando tópicos de Pulsar automáticamente...'
        
        # Esperar a que Pulsar esté completamente listo
        echo '⏳ Verificando que Pulsar esté listo...'
        for i in {1..30}; do
          if bin/pulsar-admin --admin-url http://pulsar:8080 brokers healthcheck; then
            echo 'Pulsar está listo!'
            break
          fi
          echo \"Intento \$i/30: Esperando a Pulsar...\"
          sleep 5
        done
        
        echo '📝 Creando tópicos necesarios...'
        
        # Crear tópicos para productos
        bin/pulsar-admin --admin-url http://pulsar:8080 topics create productos-queries || echo 'Tópico productos-queries ya existe'
        bin/pulsar-admin --admin-url http://pulsar:8080 topics create productos-responses || echo 'Tópico productos-responses ya existe'
        
        # Crear tópicos para proveedores  
        bin/pulsar-admin --admin-url http://pulsar:8080 topics create provedores-queries || echo 'Tópico provedores-queries ya existe'
        bin/pulsar-admin --admin-url http://pulsar:8080 topics create provedores-responses || echo 'Tópico provedores-responses ya existe'
        
        echo '📋 Verificando tópicos creados:'
        bin/pulsar-admin --admin-url http://pulsar:8080 topics list public/default
        
        echo '✅ Inicialización de tópicos completada'
      "
    restart: "no"

volumes:
  pulsar_data:
    driver: local

networks:
  app_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true
